<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Netlify Forms Endpoint</title>

    <!-- Static form template for Netlify build bot detection -->

      <input type="email" name="email" />
    </form>
  </body>
</html>
